[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mydevagent"
version = "1.0.0"
description = "MyDevAgent: assistente di programmazione local-first con 15 agenti specializzati (LangGraph + modelli open-weight)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - All rights reserved (see LICENSE)" }
dependencies = [
  "langgraph>=0.4",
  "openai>=1.40",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
search = ["ddgs>=9.0"]
finetune = [
  "unsloth",
  "trl>=0.12",
  "datasets>=2.20",
  "peft>=0.12",
  "transformers>=4.45",
]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29"]
all = ["mydevagent[server,search]"]

[project.scripts]
mydevagent = "mydevagent.cli:app"

[tool.setuptools.packages.find]
include = ["mydevagent*"]

[tool.setuptools.package-data]
mydevagent = ["py.typed", "templates/*/*", "tui/*.html"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["finetune", "mydevagent/templates/*/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
