# MyCode: Qwen2.5-Coder 14B addestrato (QLoRA) sul manuale e sugli esempi in finetune/mycode/data.
# Il 14B si addestra su Colab (GPU T4 da 16 GB): con 8 GB di VRAM non ci sta.
# Per addestrare sul PC con la RTX 4060 usa il 7B:  base_model: unsloth/Qwen2.5-Coder-7B-Instruct-bnb-4bit
base_model: unsloth/Qwen2.5-Coder-14B-Instruct-bnb-4bit
max_seq_length: 2048
load_in_4bit: true

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train:
    - finetune/mycode/data/train.jsonl       # scritti da Claude a partire dai tuoi 14 file
    - finetune/mycode/data/generated.jsonl   # aggiunti da md_to_model.py con i tuoi nuovi .md
  val: finetune/mycode/data/val.jsonl

train:
  output_dir: finetune/mycode/outputs
  epochs: 2
  batch_size: 1
  grad_accum: 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler: cosine
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  seed: 42
  responses_only: true    # impara solo dalle risposte di MyCode

export:
  gguf_dir: finetune/mycode/outputs/gguf
  quantization: q4_k_m    # ~9 GB col 14B: sulla RTX 4060 una parte va in RAM (più lento)
  ollama_name: mycode
